[package]
name = "pot4"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [ "defmt", "stm32f303vc", "unstable-pac", "memory-x", "time-driver-tim2"]  }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
defmt = "1.1.1"
defmt-rtt = "1.3.0"
cortex-m = { version = "0.7.9", features = ["inline-asm", "critical-section-single-core"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m-rt = "0.7.6"
pot-conditioner = "0.1.0"
arrayvec = { version = "0.7.8", default-features = false, features = ["serde"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
static_cell = "2"
embassy-sync = "0.8.0"
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-crc"] }
crc = { version = "3.4.0", default-features = false }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = "s"
codegen-units = 1
lto  =true
debug = true # debig info doesn't get flashed
