cargo-features = ["trim-paths"]

[package]
name = "configurator"
version = "0.1.0"
description = "Pot4 MIDI CC Controller GUI configurator"
authors = ["Taylan Gökkaya"]
edition = "2021"

[lib]
name = "configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
nusb = "0.2.7"

[profile.dev]
incremental = true
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 2
panic = "abort"
strip = true
trim-paths = "all"
