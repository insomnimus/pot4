<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="/src/styles.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Insomnia Pot4 Configurator</title>
		<script type="module" src="/src/main.ts" defer></script>
	</head>

	<body>
		<div
			id="sr-announcer"
			class="sr-only"
			role="status"
			aria-live="assertive"
			aria-atomic="true"
		></div>

		<main>
			<h1>Pot4 Configuration</h1>

			<div id="connection-status" role="status" aria-live="polite" aria-atomic="true">
				Connecting to Pot4 MIDI CC Controller...
			</div>

			<!-- Added wrapper for top action buttons -->
			<div class="actions-row">
				<button id="reconnect" type="button">Reconnect</button>
				<button id="reset" type="button">Discard Changes</button>
			</div>

			<div id="config-status" role="status" aria-live="polite" aria-atomic="true"></div>

			<fieldset>
				<legend>Preset</legend>

				<label>
					<input type="radio" name="preset" value="0" checked aria-labelledby="preset-radio-0" />
					<span id="preset-radio-0">1. Unnamed</span>
				</label>

				<label>
					<input type="radio" name="preset" value="1" aria-labelledby="preset-radio-1" />
					<span id="preset-radio-1">2. Unnamed</span>
				</label>

				<label>
					<input type="radio" name="preset" value="2" aria-labelledby="preset-label-2" />
					<span id="preset-radio-2">3. Unnamed</span>
				</label>

				<label>
					<input type="radio" name="preset" value="3" aria-labelledby="preset-radio-3" />
					<span id="preset-radio-3">4. Unnamed</span>
				</label>
			</fieldset>

			<section id="controls" aria-labelledby="preset-heading">
				<h2 id="preset-heading">Preset 1</h2>

				<!-- Added wrapper for preset name, input, and Use button -->
				<div class="preset-name-group">
					<label for="preset-name">Preset name</label>
					<input id="preset-name" type="text" maxlength="32" />
					<button
						id="use-preset"
						type="button"
						title="Use this preset's values for the active live configuration"
					>
						Use
					</button>
				</div>
				<table>
					<thead>
						<tr>
							<th scope="col">Setting</th>
							<th scope="col" data-pot="0">Pot 1</th>
							<th scope="col" data-pot="1">Pot 2</th>
							<th scope="col" data-pot="2">Pot 3</th>
							<th scope="col" data-pot="3">Pot 4</th>
						</tr>
					</thead>
					<tbody id="pot-config">
						<tr data-field="cc">
							<th scope="row">CC</th>
							<td>
								<input
									data-pot="0"
									data-field="cc"
									type="text"
									inputmode="numeric"
									pattern="[0-9]*"
								/>
							</td>
							<td>
								<input
									data-pot="1"
									data-field="cc"
									type="text"
									inputmode="numeric"
									pattern="[0-9]*"
								/>
							</td>
							<td>
								<input
									data-pot="2"
									data-field="cc"
									type="text"
									inputmode="numeric"
									pattern="[0-9]*"
								/>
							</td>
							<td>
								<input
									data-pot="3"
									data-field="cc"
									type="text"
									inputmode="numeric"
									pattern="[0-9]*"
								/>
							</td>
						</tr>
						<tr data-field="channel">
							<th scope="row">Channel</th>
							<td>
								<input
									data-pot="0"
									data-field="channel"
									type="text"
									inputmode="numeric"
									pattern="[0-9]*"
								/>
							</td>
							<td>
								<input
									data-pot="1"
									data-field="channel"
									type="text"
									inputmode="numeric"
									pattern="[0-9]*"
								/>
							</td>
							<td>
								<input
									data-pot="2"
									data-field="channel"
									type="text"
									inputmode="numeric"
									pattern="[0-9]*"
								/>
							</td>
							<td>
								<input
									data-pot="3"
									data-field="channel"
									type="text"
									inputmode="numeric"
									pattern="[0-9]*"
								/>
							</td>
						</tr>
						<tr data-field="trigger" data-source-pot="0">
							<th scope="row">Trigger Pot 1</th>
							<td>
								<input type="checkbox" data-pot="0" data-field="trigger" data-source-pot="0" />
							</td>
							<td>
								<input type="checkbox" data-pot="1" data-field="trigger" data-source-pot="0" />
							</td>
							<td>
								<input type="checkbox" data-pot="2" data-field="trigger" data-source-pot="0" />
							</td>
							<td>
								<input type="checkbox" data-pot="3" data-field="trigger" data-source-pot="0" />
							</td>
						</tr>
						<tr data-field="trigger" data-source-pot="1">
							<th scope="row">Trigger Pot 2</th>
							<td>
								<input type="checkbox" data-pot="0" data-field="trigger" data-source-pot="1" />
							</td>
							<td>
								<input type="checkbox" data-pot="1" data-field="trigger" data-source-pot="1" />
							</td>
							<td>
								<input type="checkbox" data-pot="2" data-field="trigger" data-source-pot="1" />
							</td>
							<td>
								<input type="checkbox" data-pot="3" data-field="trigger" data-source-pot="1" />
							</td>
						</tr>
						<tr data-field="trigger" data-source-pot="2">
							<th scope="row">Trigger Pot 3</th>
							<td>
								<input type="checkbox" data-pot="0" data-field="trigger" data-source-pot="2" />
							</td>
							<td>
								<input type="checkbox" data-pot="1" data-field="trigger" data-source-pot="2" />
							</td>
							<td>
								<input type="checkbox" data-pot="2" data-field="trigger" data-source-pot="2" />
							</td>
							<td>
								<input type="checkbox" data-pot="3" data-field="trigger" data-source-pot="2" />
							</td>
						</tr>
						<tr data-field="trigger" data-source-pot="3">
							<th scope="row">Trigger Pot 4</th>
							<td>
								<input type="checkbox" data-pot="0" data-field="trigger" data-source-pot="3" />
							</td>
							<td>
								<input type="checkbox" data-pot="1" data-field="trigger" data-source-pot="3" />
							</td>
							<td>
								<input type="checkbox" data-pot="2" data-field="trigger" data-source-pot="3" />
							</td>
							<td>
								<input type="checkbox" data-pot="3" data-field="trigger" data-source-pot="3" />
							</td>
						</tr>
					</tbody>
				</table>

				<button id="save" type="button" disabled>Persist current configuration</button>
			</section>
		</main>
	</body>
</html>
